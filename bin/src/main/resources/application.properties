server.port=8081
spring.application.name=bus-ticket-booking

# ---- MySQL (change username/password to match your MySQL install) ----
spring.datasource.url=jdbc:mysql://localhost:3306/busgo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---- JWT ----
jwt.secret=BusGoSuperSecretKeyForJwtSigning_ChangeMe_AtLeast32Bytes_2026
jwt.expiration-ms=86400000

# ---- CORS (frontend dev server) ----
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
