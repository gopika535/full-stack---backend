server.port=${PORT:8081}
spring.application.name=bus-ticket-booking

# ---- MySQL Data Source (Supports Railway environment variables and fallback to local) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQL_DATABASE:busgo}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:Gopi@123}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---- JWT ----
jwt.secret=${JWT_SECRET:BusGoSuperSecretKeyForJwtSigning_ChangeMe_AtLeast32Bytes_2026}
jwt.expiration-ms=86400000

# ---- CORS (supports frontend local + Railway production) ----
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://full-stack-frontend-production.up.railway.app,https://*.up.railway.app}
